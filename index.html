<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>混沌双摆模拟</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <div id="control-panel">
        <h2>混沌双摆参数控制</h2>
    <div id="numerical-warning" style="display: none;"></div>

        <div class="param-section">
          <h3>摆参数</h3>
          <div class="control-group">
            <label>物理模式:
              <select id="physics-mode">
                <option value="planar" selected>平面双摆</option>
                <option value="spherical">球面双摆(3D)</option>
              </select>
            </label>
          </div>
          <div class="control-group">
            <label>杆长 L₁ (m): <span id="l1-value">1.0</span></label>
            <input
              type="range"
              id="l1"
              min="0.5"
              max="2"
              step="0.1"
              value="1.0"
            />
          </div>
          <div class="control-group">
            <label>杆长 L₂ (m): <span id="l2-value">1.0</span></label>
            <input
              type="range"
              id="l2"
              min="0.5"
              max="2"
              step="0.1"
              value="1.0"
            />
          </div>
          <div class="control-group">
            <label>质量 m₁ (kg): <span id="m1-value">1.0</span></label>
            <input
              type="range"
              id="m1"
              min="0.1"
              max="5"
              step="0.1"
              value="1.0"
            />
          </div>
          <div class="control-group">
            <label>质量 m₂ (kg): <span id="m2-value">1.0</span></label>
            <input
              type="range"
              id="m2"
              min="0.1"
              max="5"
              step="0.1"
              value="1.0"
            />
          </div>
        </div>

        <div class="param-section">
          <h3>初始条件</h3>
          <div class="control-group">
            <label>角度 θ₁ (°): <span id="theta1-value">90</span></label>
            <input
              type="range"
              id="theta1"
              min="-180"
              max="180"
              step="1"
              value="90"
            />
          </div>
          <div class="control-group">
            <label>角度 θ₂ (°): <span id="theta2-value">90</span></label>
            <input
              type="range"
              id="theta2"
              min="-180"
              max="180"
              step="1"
              value="90"
            />
          </div>
          <div class="control-group">
            <label>角速度 ω₁ (rad/s): <span id="omega1-value">0</span></label>
            <input
              type="range"
              id="omega1"
              min="-10"
              max="10"
              step="0.1"
              value="0"
            />
          </div>
          <div class="control-group">
            <label>角速度 ω₂ (rad/s): <span id="omega2-value">0</span></label>
            <input
              type="range"
              id="omega2"
              min="-10"
              max="10"
              step="0.1"
              value="0"
            />
          </div>
          <div class="spherical-only" id="spherical-only">
            <div class="control-group">
              <label>方位角 φ₁ (°): <span id="phi1-value">0</span></label>
              <input
                type="range"
                id="phi1"
                min="-180"
                max="180"
                step="1"
                value="0"
              />
            </div>
            <div class="control-group">
              <label>方位角 φ₂ (°): <span id="phi2-value">0</span></label>
              <input
                type="range"
                id="phi2"
                min="-180"
                max="180"
                step="1"
                value="0"
              />
            </div>
            <div class="control-group">
              <label>角速度 ωφ₁ (rad/s): <span id="omegaphi1-value">0</span></label>
              <input
                type="range"
                id="omegaphi1"
                min="-10"
                max="10"
                step="0.1"
                value="0"
              />
            </div>
            <div class="control-group">
              <label>角速度 ωφ₂ (rad/s): <span id="omegaphi2-value">0</span></label>
              <input
                type="range"
                id="omegaphi2"
                min="-10"
                max="10"
                step="0.1"
                value="0"
              />
            </div>
          </div>
        </div>

        <div class="control-group">
          <label>
            <input type="checkbox" id="show-trail" checked />
            显示轨迹
          </label>
        </div>

        <div class="button-group">
          <button id="play-btn">播放</button>
          <button id="pause-btn">暂停</button>
          <button id="reset-btn">重置</button>
        </div>

        <div class="param-section">
          <h3>混沌对比</h3>
          <div class="compare-legend">
            <span class="compare-legend-item">
              <span class="compare-dot compare-dot-a"></span>A 摆
            </span>
            <span class="compare-legend-item">
              <span class="compare-dot compare-dot-b"></span>B 摆
            </span>
          </div>
          <div class="control-group">
            <label>
              <input type="checkbox" id="compare-enable" />
              启用对比摆 B
            </label>
          </div>
          <div class="control-group">
            <label>初始差值 δ: <input type="number" id="compare-delta" value="0.1" min="0" step="0.1" /></label>
          </div>
          <div class="control-group">
            <label>施加变量:
              <select id="compare-field">
                <option value="theta1" selected>角度 θ₁</option>
                <option value="theta2">角度 θ₂</option>
                <option value="omega1">角速度 ω₁</option>
                <option value="omega2">角速度 ω₂</option>
              </select>
            </label>
          </div>
          <div class="control-group">
            <button id="compare-resync">重新同步 B</button>
          </div>
          <div id="compare-readout" style="display: none;">
            <p>|Δθ₁|: <span id="delta-theta1">--</span> °</p>
            <p>|Δθ₂|: <span id="delta-theta2">--</span> °</p>
          </div>
          <p class="compare-hint">A/B 仅一个初值相差 δ,观察轨迹如何分裂。</p>
        </div>

        <div class="data-display">
          <h3>实时数据</h3>
          <p>角度 θ₁: <span id="current-theta1">--</span> °</p>
          <p>角度 θ₂: <span id="current-theta2">--</span> °</p>
          <p>角动量 p₁: <span id="current-omega1">--</span></p>
          <p>角动量 p₂: <span id="current-omega2">--</span></p>
          <p>总能量 E: <span id="total-energy">--</span> J</p>
          <p>运行时间: <span id="run-time">--</span> s</p>
        </div>
      </div>

      <div id="canvas-container"></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="script.js"></script>
  </body>
</html>
