<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>混沌双摆模拟</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <div id="control-panel">
        <h2>混沌双摆参数控制</h2>
    <div id="numerical-warning" style="display: none;"></div>

        <div class="param-section">
          <h3>摆参数</h3>
          <div class="control-group">
            <label>物理模式:</label>
            <div class="segment" id="mode-segment">
              <button type="button" data-mode="planar" class="active">平面</button>
              <button type="button" data-mode="spherical">球面 3D</button>
            </div>
          </div>
          <div class="control-group">
            <label>杆数: <span id="link-count-value">2</span></label>
            <input
              type="range"
              id="link-count"
              min="1"
              max="8"
              step="1"
              value="2"
            />
          </div>
          <div id="links-params"></div>
        </div>

        <div class="param-section">
          <div class="section-header">
            <h3>初始条件</h3>
            <button type="button" id="random-btn">随机初始值</button>
          </div>
          <div id="links-initial"></div>
        </div>

        <div class="control-group">
          <label>
            <input type="checkbox" id="show-trail" checked />
            显示轨迹
          </label>
        </div>

        <div class="button-group">
          <button id="play-toggle-btn">播放</button>
          <button id="reset-btn">重置</button>
        </div>

        <div class="param-section">
          <h3>混沌对比</h3>
          <div class="compare-legend">
            <span class="compare-legend-item">
              <span class="compare-dot compare-dot-a"></span>A 摆
            </span>
            <span class="compare-legend-item">
              <span class="compare-dot compare-dot-b"></span>B 摆
            </span>
          </div>
          <div class="control-group">
            <label>
              <input type="checkbox" id="compare-enable" />
              启用对比摆 B
            </label>
          </div>
          <div class="control-group">
            <label>初始差值 δ: <input type="number" id="compare-delta" value="0.1" min="0" step="0.1" /></label>
          </div>
          <div class="control-group">
            <label>施加变量:
              <select id="compare-field">
                <option value="theta1" selected>角度 θ₁</option>
                <option value="theta2">角度 θ₂</option>
                <option value="omega1">角速度 ω₁</option>
                <option value="omega2">角速度 ω₂</option>
              </select>
            </label>
          </div>
          <div class="control-group">
            <button id="compare-resync">重新同步 B</button>
          </div>
          <div id="compare-readout" style="display: none;">
            <p>|Δθ| 首锤: <span id="delta-theta-first">--</span> °</p>
            <p>|Δθ| 末锤: <span id="delta-theta-last">--</span> °</p>
          </div>
          <p class="compare-hint">A/B 仅一个初值相差 δ,观察轨迹如何分裂。</p>
        </div>

        <div class="data-display">
          <h3>实时数据</h3>
          <div id="links-data"></div>
          <p>总能量 E: <span id="total-energy">--</span> J</p>
          <p>运行时间: <span id="run-time">--</span> s</p>
        </div>
      </div>

      <div id="canvas-container"></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="script.js"></script>
  </body>
</html>
